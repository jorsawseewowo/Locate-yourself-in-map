<!DOCTYPE html>
<html>

<head>
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin-top: 50px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        h2 {
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>BMI Calculator</h1>

        <form method="POST">
            <input type="number" step="0.01" name="Weight" placeholder="Enter Weight (kg)" required>

            <input type="number" step="0.01" name="Height" placeholder="Enter Height (cm)" required>

            <button type="submit">Calculate BMI</button>
        </form>

        {% if bmi %}
        <h2>Your BMI: {{ bmi }}</h2>
        {% endif %}
    </div>

</body>

</html>
